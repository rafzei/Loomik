name: Publish verified release packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native-builds run ID from a push to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'rafzei/Loomik' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'rafzei' && github.triggering_actor == 'rafzei'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source run and package checksums
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/publish_release.py prepare --run-id "$SOURCE_RUN_ID" --directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: >-
      github.repository == 'rafzei/Loomik' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'rafzei' && github.triggering_actor == 'rafzei'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/release
      - name: Publish packages or verify an identical existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py publish --directory "$RUNNER_TEMP/release"
