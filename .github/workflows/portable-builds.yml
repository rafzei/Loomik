name: Native builds and verified packages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'rafzei/Loomik' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && github.actor == 'rafzei' && github.triggering_actor == 'rafzei'))
    name: Build/package ${{ matrix.platform }} (runner ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: ubuntu-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: macOS SDK for ScreenCaptureKit's Swift/Metal bridge
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config nasm
      - name: Windows media compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar curl nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libegl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libpipewire-0.3-dev libspa-0.2-dev libasound2-dev clang libclang-dev linux-libc-dev dpkg-dev desktop-file-utils xvfb
      - name: Cache source-built media tools
        if: runner.os != 'Linux'
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/media-tools/${{ matrix.platform }}
          key: media-${{ matrix.os }}-${{ matrix.platform }}-${{ hashFiles('packaging/media-sources.env', 'packaging/MEDIA-NOTICE.txt', 'scripts/build-media-tools.sh') }}
      - name: Build macOS media tools
        if: runner.os == 'macOS' && steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-media-tools.sh
      - name: Build Windows media tools
        if: runner.os == 'Windows' && steps.media-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-media-tools.sh
      - name: Save completed media build before application checks
        if: runner.os != 'Linux' && steps.media-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/media-tools/${{ matrix.platform }}
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Use bundled media tools for all tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          media_bin="$GITHUB_WORKSPACE/target/media-tools/${{ matrix.platform }}/bin"
          suffix=''; if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          echo "$media_bin" >> "$GITHUB_PATH"
          echo "LOOMIK_FFMPEG=$media_bin/ffmpeg$suffix" >> "$GITHUB_ENV"
          echo "LOOMIK_FFPROBE=$media_bin/ffprobe$suffix" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Verify packaging dependency checks
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify isolated X11 window capture
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --test x11_capture -- --ignored
      - name: Build Windows MSVC release
        if: runner.os == 'Windows'
        # Git Bash puts its coreutils link.exe ahead of the MSVC linker.
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build release
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Package Windows MSVC release
        if: runner.os == 'Windows'
        run: ./scripts/bundle-windows.ps1 -SkipBuild
      - name: Package and verify macOS ZIP/DMG
        if: runner.os == 'macOS'
        run: python scripts/package-desktop.py --skip-build
      - name: Package Ubuntu desktop application
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/io.github.rafzei.Loomik.desktop
          bash scripts/bundle-linux.sh --skip-build
          sudo apt-get install -y ./target/release/bundle/Loomik-*-Ubuntu-24.04-amd64.deb
          mkdir -p artifacts
          LIBGL_ALWAYS_SOFTWARE=1 timeout 45s xvfb-run -a loomik --ui-smoke "$PWD/artifacts/ubuntu-package-ui" --reset-settings
          python -c 'import json; r=json.load(open("artifacts/ubuntu-package-ui/ui-smoke.json")); assert r["ffmpeg_ready"] and not r["error"], r'
      # These are build artifacts, not a claim of native capture feature parity.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loomik-${{ matrix.platform }}-build
          path: |
            target/release/bundle/Loomik-*.zip
            target/release/bundle/Loomik-*.dmg
            target/release/bundle/Loomik-*.sha256
            target/release/bundle/Loomik-*.json
            target/release/bundle/Loomik-*.deb
          if-no-files-found: error
